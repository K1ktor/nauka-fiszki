# Buduje instalator Windows i publikuje wydanie na GitHub Releases razem z latest.json,
# z którego aplikacja sama pobiera aktualizacje.
# Uruchamia się po wypchnięciu gałęzi "wydanie" (git push origin main:wydanie)
# albo tagu (git tag v0.4.0 && git push origin v0.4.0). Tag v<wersja> tworzy się sam.
# Ręczne uruchomienie na innej gałęzi niż main = wersja testowa: prywatny szkic wydania
# (widoczny tylko dla właściciela repo), bez latest.json, więc aktualizator go nie zaproponuje.
name: Wydanie

on:
  push:
    branches: [wydanie]
    tags: ["v*"]
  workflow_dispatch:

env:
  TESTOWA: ${{ github.event_name == 'workflow_dispatch' && github.ref_name != 'main' }}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: "${{ env.TESTOWA == 'true' && format('test-v__VERSION__-{0}', github.run_number) || 'v__VERSION__' }}"
          releaseName: "${{ env.TESTOWA == 'true' && format('Fiszki v__VERSION__ – wersja testowa {0} ({1})', github.run_number, github.ref_name) || 'Fiszki v__VERSION__' }}"
          releaseBody: "${{ env.TESTOWA == 'true' && 'Prywatna wersja testowa (szkic). Nie trafia do automatycznych aktualizacji. Pobierz Fiszki_..._x64-setup.exe i zainstaluj ręcznie.' || 'Zainstalowana aplikacja zaproponuje tę wersję sama przy następnym uruchomieniu. Pierwsza instalacja: pobierz plik Fiszki_..._x64-setup.exe poniżej.' }}"
          releaseDraft: ${{ env.TESTOWA == 'true' }}
          prerelease: ${{ env.TESTOWA == 'true' }}
          includeUpdaterJson: ${{ env.TESTOWA != 'true' }}
          updaterJsonPreferNsis: true
          args: --bundles nsis
